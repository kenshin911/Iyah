
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 85" width="100%" height="100%">
  <!-- Ears -->
  <ellipse cx="24" cy="22" rx="14" ry="16" fill="#ffffff" stroke="#333333" stroke-width="3" transform="rotate(-25 24 22)"/>
  <ellipse cx="76" cy="22" rx="14" ry="16" fill="#ffffff" stroke="#333333" stroke-width="3" transform="rotate(25 76 22)"/>
  <!-- Head -->
  <ellipse cx="50" cy="46" rx="42" ry="34" fill="#ffffff" stroke="#333333" stroke-width="3.5"/>
