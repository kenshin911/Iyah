  <line x1="16" y1="46" x2="2" y2="44" stroke="#333333" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="16" y1="52" x2="2" y2="54" stroke="#333333" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="84" y1="46" x2="98" y2="44" stroke="#333333" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="84" y1="52" x2="98" y2="54" stroke="#333333" stroke-width="2.5" stroke-linecap="round"/>
